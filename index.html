<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff6f7">
  <title>Marian</title>

  <style>
    :root{
      --rosa:#d98e99;
      --rosa2:#bd7180;
      --texto:#2c2325;
      --suave:#7a6f72;
      --borde:rgba(130,82,92,.16);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#fff9fa;color:var(--texto)}
    a{text-decoration:none;color:inherit}
    button{font:inherit}

    .app{
      width:100%;
      max-width:520px;
      min-height:100vh;
      margin:0 auto;
      background:
        radial-gradient(circle at top left,#ffe5ea 0,transparent 35%),
        radial-gradient(circle at top right,#f9e8df 0,transparent 40%),
        #fffafa;
    }

    .profile{
      padding:24px 16px 18px;
      text-align:center;
      border-bottom:1px solid var(--borde);
      background:rgba(255,255,255,.78);
      backdrop-filter:blur(16px);
    }

    .avatar-wrap{
      position:relative;
      width:116px;
      height:116px;
      margin:0 auto 12px;
      padding:4px;
      border-radius:50%;
      background:linear-gradient(135deg,#c97c88,#f3c8ce,#bd7180);
      box-shadow:0 12px 30px rgba(104,64,73,.14);
    }

    .avatar{
      width:100%;
      height:100%;
      object-fit:cover;
      border-radius:50%;
      border:4px solid #fff;
      display:block;
    }

    .name-row{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:7px;
    }

    h1{
      margin:0;
      font:500 36px Georgia,"Times New Roman",serif;
    }

    .verified-small{
      width:22px;
      height:22px;
      display:grid;
      place-items:center;
      border-radius:50%;
      color:#fff;
      background:var(--rosa);
      font-size:13px;
      font-weight:900;
    }

    .username{margin:5px 0 8px;color:var(--suave);font-size:15px}
    .bio{margin:0 auto 18px;max-width:340px;line-height:1.45;font-size:15px}

    .actions{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }

    .action{
      min-height:68px;
      padding:9px 5px;
      border:1px solid var(--borde);
      border-radius:17px;
      background:rgba(255,255,255,.92);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:6px;
      font-size:13px;
      font-weight:700;
      box-shadow:0 7px 18px rgba(102,66,73,.08);
    }

    .action.primary{
      color:#fff;
      border-color:transparent;
      background:linear-gradient(135deg,var(--rosa),var(--rosa2));
    }

    .action svg{
      width:23px;
      height:23px;
      fill:none;
      stroke:currentColor;
      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .grid-title{
      display:flex;
      align-items:center;
      justify-content:center;
      height:50px;
      background:#fff;
      border-bottom:1px solid var(--borde);
      color:var(--rosa);
    }

    .grid-title svg{
      width:27px;
      height:27px;
      fill:none;
      stroke:currentColor;
      stroke-width:1.8;
    }

    .gallery{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:2px;
      background:#fff;
    }

    .thumb{
      position:relative;
      aspect-ratio:1/1.22;
      border:0;
      padding:0;
      overflow:hidden;
      background:#111;
      cursor:pointer;
    }

    .thumb video{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      pointer-events:none;
    }

    .thumb::after{
      content:"▶";
      position:absolute;
      top:8px;
      right:8px;
      width:26px;
      height:26px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:rgba(0,0,0,.38);
      color:#fff;
      font-size:12px;
    }

    .viewer{
      position:fixed;
      inset:0;
      z-index:1000;
      display:none;
      background:#050505;
    }

    .viewer.open{display:block}

    .close{
      position:fixed;
      top:calc(14px + env(safe-area-inset-top));
      left:14px;
      z-index:1020;
      width:42px;
      height:42px;
      display:grid;
      place-items:center;
      border:0;
      border-radius:50%;
      background:rgba(20,20,20,.56);
      color:#fff;
      font-size:28px;
      cursor:pointer;
      backdrop-filter:blur(10px);
    }

    .reels{
      height:100%;
      overflow-y:auto;
      scroll-snap-type:y mandatory;
      scrollbar-width:none;
    }

    .reels::-webkit-scrollbar{display:none}

    .reel{
      position:relative;
      width:100%;
      height:100dvh;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      scroll-snap-align:start;
      scroll-snap-stop:always;
      background:#050505;
    }

    .reel video{
      width:100%;
      height:100%;
      object-fit:contain;
      background:#050505;
    }

    .shade{
      position:absolute;
      inset:auto 0 0;
      height:42%;
      background:linear-gradient(transparent,rgba(0,0,0,.78));
      pointer-events:none;
    }

    .caption{
      position:absolute;
      left:16px;
      right:84px;
      bottom:calc(26px + env(safe-area-inset-bottom));
      z-index:2;
      color:#fff;
    }

    .caption-name{
      display:flex;
      align-items:center;
      gap:6px;
      margin-bottom:7px;
      font-weight:800;
      font-size:17px;
    }

    .caption p{
      margin:0;
      line-height:1.38;
      font-size:14px;
      color:rgba(255,255,255,.94);
    }

    .side-actions{
      position:absolute;
      right:14px;
      bottom:calc(28px + env(safe-area-inset-bottom));
      z-index:3;
      display:flex;
      flex-direction:column;
      gap:16px;
    }

    .circle{
      width:52px;
      height:52px;
      display:grid;
      place-items:center;
      border:0;
      border-radius:50%;
      background:rgba(20,20,20,.48);
      color:#fff;
      backdrop-filter:blur(10px);
      cursor:pointer;
    }

    .circle svg{
      width:29px;
      height:29px;
      fill:none;
      stroke:currentColor;
      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .circle.liked{color:#ff758a}
    .circle.liked svg{fill:currentColor;stroke:currentColor}

    @media (min-width:521px){
      body{padding:18px 0}
      .app{border-radius:28px;overflow:hidden;box-shadow:0 0 45px rgba(78,46,53,.11)}
      .viewer{left:50%;width:520px;transform:translateX(-50%)}
      .close{left:calc(50% - 246px)}
    }
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>
  <main class="app">
    <section class="profile">
      <div class="avatar-wrap">
        <img class="avatar" src="profile.jpg" alt="Foto de Marian">
      </div>

      <div class="name-row">
        <h1>Marian</h1>
        <span class="verified-small">✓</span>
      </div>

      <p class="username">@marianvideos</p>
      <p class="bio">Mis momentos, mis reels y un poquito más de mí 💕</p>

      <div class="actions">
        <button class="action primary" type="button" onclick="abrirChatTelegram()">
          <svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8Z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
          <span>Comprar contenido</span>
        </button>

        <button class="action" type="button" onclick="abrirCanalTelegram()">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="m10 9 5 3-5 3V9Z"></path></svg>
          <span>Ver canal</span>
        </button>

        <button class="action" type="button" onclick="abrirChatTelegram()">
          <svg viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3 1.5-4A7 7 0 0 1 3 14V9a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v6Z"></path></svg>
          <span>Escribirme</span>
        </button>
      </div>
    </section>

    <div class="grid-title">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
        <path d="M3 9h18M3 15h18M9 3v18M15 3v18"></path>
      </svg>
    </div>

    <section class="gallery" id="gallery"></section>
  </main>

  <section class="viewer" id="viewer" aria-hidden="true">
    <button class="close" id="closeViewer" type="button" aria-label="Cerrar">×</button>
    <div class="reels" id="reels"></div>
  </section>

  <script>
    const chatTelegram = "https://t.me/marianvideos";
    const canalTelegram = "https://t.me/+63oyr6Flo7Q0OTUx";

    function abrirEnTelegram(url) {
      if (window.Telegram && Telegram.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.openTelegramLink(url);
        return;
      }

      // Fuera de Telegram, intentamos abrir la app directamente.
      window.location.href = "tg://resolve?domain=marianvideos";
    }

    function abrirChatTelegram() {
      abrirEnTelegram(chatTelegram);
    }

    function abrirCanalTelegram() {
      if (window.Telegram && Telegram.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.openTelegramLink(canalTelegram);
        return;
      }
      window.location.href = canalTelegram;
    }

    const videos = [
      { src: "reel00001.mp4", caption: "Hoy vine a dejarte pensando en mí 💕" },
      { src: "reel00002.mp4", caption: "Un momento que quería compartir contigo ✨" },
      { src: "reel00003.mp4", caption: "Desliza, pero no te vayas tan rápido 😘" },
      { src: "reel00004.mp4", caption: "Mi energía favorita siempre aparece aquí 💗" },
      { src: "reel00005.mp4", caption: "Solo un poquito de mi día para ti ✨" },
      { src: "reel00006.mp4", caption: "¿Cuál ha sido tu reel favorito hasta ahora? 👀" },
      { src: "reel00007.mp4", caption: "Me encanta cuando te quedas a mirar 💕" },
      { src: "reel00008.mp4", caption: "Hoy estoy de buen humor y se nota 😘" },
      { src: "reel00009.mp4", caption: "Otro momento mío que no quería guardar sola ✨" },
      { src: "reel00010.mp4", caption: "Sigue deslizando, todavía falta lo mejor 💗" },
      { src: "reel00011.mp4", caption: "Aquí siempre encontrarás algo nuevo de mí 👀" },
      { src: "reel00012.mp4", caption: "Llegaste al último… ¿me escribes? 💕" }
    ];

    const gallery = document.getElementById("gallery");
    const viewer = document.getElementById("viewer");
    const reels = document.getElementById("reels");
    const closeViewer = document.getElementById("closeViewer");

    videos.forEach((item, index) => {
      const thumb = document.createElement("button");
      thumb.className = "thumb";
      thumb.type = "button";

      const preview = document.createElement("video");
      preview.src = item.src;
      preview.muted = true;
      preview.playsInline = true;
      preview.preload = "metadata";
      thumb.appendChild(preview);

      thumb.addEventListener("click", () => openViewer(index));
      gallery.appendChild(thumb);

      const reel = document.createElement("article");
      reel.className = "reel";
      reel.dataset.index = index;

      const video = document.createElement("video");
      video.src = item.src;
      video.loop = true;
      video.playsInline = true;
      video.preload = "metadata";
      video.controls = false;
      video.addEventListener("click", () => {
        playOnly(video);
      });
      reel.appendChild(video);

      const shade = document.createElement("div");
      shade.className = "shade";
      reel.appendChild(shade);

      const caption = document.createElement("div");
      caption.className = "caption";
      caption.innerHTML = `
        <div class="caption-name">
          Marian <span class="verified-small">✓</span>
        </div>
        <p>${item.caption}</p>
      `;
      reel.appendChild(caption);

      const side = document.createElement("div");
      side.className = "side-actions";

      const heart = document.createElement("button");
      heart.className = "circle";
      heart.type = "button";
      heart.innerHTML = `
        <svg viewBox="0 0 24 24">
          <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 1 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"></path>
        </svg>
      `;
      heart.addEventListener("click", () => heart.classList.toggle("liked"));

      const message = document.createElement("button");
      message.className = "circle";
      message.type = "button";
      message.innerHTML = `
        <svg viewBox="0 0 24 24">
          <path d="M21 15a4 4 0 0 1-4 4H8l-5 3 1.5-4A7 7 0 0 1 3 14V9a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v6Z"></path>
        </svg>
      `;
      message.addEventListener("click", () => {
        abrirChatTelegram();
      });

      side.appendChild(heart);
      side.appendChild(message);
      reel.appendChild(side);

      reels.appendChild(reel);
    });

    function playOnly(targetVideo) {
      document.querySelectorAll(".reel video").forEach((video) => {
        if (video !== targetVideo) {
          video.pause();
        }
      });

      targetVideo.muted = false;
      targetVideo.defaultMuted = false;
      targetVideo.volume = 1;

      const intento = targetVideo.play();
      if (intento && typeof intento.catch === "function") {
        intento.catch(() => {
          // Algunos navegadores bloquean sonido automático aunque se haya tocado la miniapp.
          // En ese caso, el video queda visible y se reproducirá al tocarlo.
        });
      }
    }

    function openViewer(index) {
      viewer.classList.add("open");
      viewer.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";

      const reel = reels.querySelector(`.reel[data-index="${index}"]`);
      if (reel) {
        reel.scrollIntoView({ block: "start" });
        const video = reel.querySelector("video");

        // Se ejecuta inmediatamente dentro del toque en la miniatura,
        // para que iPhone permita iniciar el audio.
        if (video) {
          video.currentTime = Math.max(0, video.currentTime);
          playOnly(video);
        }
      }
    }

    function closeReels() {
      viewer.classList.remove("open");
      viewer.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      document.querySelectorAll(".reel video").forEach((video) => video.pause());
    }

    closeViewer.addEventListener("click", closeReels);

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (!viewer.classList.contains("open")) return;

        const video = entry.target.querySelector("video");
        if (!video) return;

        if (entry.isIntersecting && entry.intersectionRatio >= 0.65) {
          playOnly(video);
        } else {
          video.pause();
        }
      });
    }, { threshold: [0.65] });

    document.querySelectorAll(".reel").forEach((reel) => observer.observe(reel));
  </script>
</body>
</html>
