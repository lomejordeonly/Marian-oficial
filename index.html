<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff6f7">
  <title>Marian</title>

  <style>
    :root {
      --fondo: #fffafa;
      --tarjeta: rgba(255, 255, 255, 0.9);
      --rosa: #dc8f99;
      --texto: #2b2325;
      --texto-suave: #786d70;
      --borde: rgba(172, 118, 127, 0.18);
      --sombra: 0 12px 35px rgba(108, 67, 75, 0.12);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #ffe8eb 0, transparent 35%),
        radial-gradient(circle at top right, #f8e8df 0, transparent 38%),
        var(--fondo);
      color: var(--texto);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    button, a { font: inherit; }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.58);
      box-shadow: 0 0 50px rgba(83, 47, 54, 0.08);
    }

    .profile {
      padding: 28px 18px 20px;
      text-align: center;
      border-bottom: 1px solid var(--borde);
      backdrop-filter: blur(18px);
    }

    .avatar-wrap {
      position: relative;
      width: 118px;
      height: 118px;
      margin: 0 auto 14px;
      padding: 4px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d78b96, #f2cacd, #b9707c);
      box-shadow: var(--sombra);
    }

    .avatar {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border: 4px solid white;
      border-radius: 50%;
      background: #f4e5e7;
    }

    .verified-avatar {
      position: absolute;
      right: 2px;
      bottom: 8px;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 3px solid white;
      border-radius: 50%;
      background: var(--rosa);
      color: white;
      font-size: 17px;
      font-weight: 800;
    }

    .name-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .name {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 36px;
      font-weight: 500;
      letter-spacing: -1px;
    }

    .verified-name {
      width: 23px;
      height: 23px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--rosa);
      color: white;
      font-size: 14px;
      font-weight: 900;
    }

    .username {
      margin: 5px 0 10px;
      color: var(--texto-suave);
      font-size: 15px;
    }

    .bio {
      max-width: 340px;
      margin: 0 auto 20px;
      color: #51474a;
      font-size: 15px;
      line-height: 1.5;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .action {
      min-height: 68px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid var(--borde);
      border-radius: 17px;
      background: var(--tarjeta);
      color: var(--texto);
      text-decoration: none;
      font-size: 13px;
      font-weight: 650;
      box-shadow: 0 7px 20px rgba(111, 73, 80, 0.08);
    }

    .action.primary {
      background: linear-gradient(135deg, #e4a0a9, #ca7d89);
      color: white;
      border-color: transparent;
    }

    .action svg {
      width: 23px;
      height: 23px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tabs {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--borde);
      background: rgba(255, 255, 255, 0.72);
    }

    .tab-icon {
      width: 27px;
      height: 27px;
      color: var(--rosa);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      background: white;
    }

    .post {
      position: relative;
      aspect-ratio: 1 / 1.22;
      padding: 0;
      overflow: hidden;
      border: 0;
      background: #eee5e7;
      cursor: pointer;
    }

    .post img, .post video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .video-mark {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.35);
      color: white;
    }

    .viewer {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      background: #080808;
    }

    .viewer.open { display: block; }

    .viewer-close {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      left: 14px;
      z-index: 1020;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(20, 20, 20, 0.56);
      color: white;
      font-size: 27px;
      cursor: pointer;
    }

    .reels {
      height: 100%;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }

    .reels::-webkit-scrollbar { display: none; }

    .reel {
      position: relative;
      width: 100%;
      height: 100dvh;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #070707;
    }

    .reel-media {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #070707;
    }

    .reel-gradient {
      position: absolute;
      inset: auto 0 0;
      height: 36%;
      pointer-events: none;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.72));
    }

    .reel-info {
      position: absolute;
      left: 18px;
      right: 86px;
      bottom: calc(26px + env(safe-area-inset-bottom));
      z-index: 3;
      color: white;
      text-align: left;
    }

    .reel-name {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 8px;
      font-size: 17px;
      font-weight: 750;
    }

    .mini-verified {
      width: 18px;
      height: 18px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      background: var(--rosa);
      color: white;
      font-size: 11px;
    }

    .reel-caption {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
      color: rgba(255, 255, 255, 0.94);
    }

    .reel-actions {
      position: absolute;
      right: 14px;
      bottom: calc(30px + env(safe-area-inset-bottom));
      z-index: 4;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .round-action {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(22, 22, 22, 0.47);
      color: white;
      cursor: pointer;
    }

    .round-action svg {
      width: 29px;
      height: 29px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .round-action.liked {
      color: #ff7086;
    }

    .round-action.liked svg {
      fill: currentColor;
      stroke: currentColor;
    }

    @media (min-width: 521px) {
      body { padding: 20px 0; }
      .app {
        min-height: calc(100vh - 40px);
        overflow: hidden;
        border-radius: 30px;
      }
      .viewer {
        left: 50%;
        width: 520px;
        transform: translateX(-50%);
      }
      .viewer-close {
        left: calc(50% - 246px);
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="profile">
      <div class="avatar-wrap">
        <img class="avatar" src="profile.jpg" alt="Foto de Marian">
        <span class="verified-avatar">✓</span>
      </div>

      <div class="name-row">
        <h1 class="name">Marian</h1>
        <span class="verified-name">✓</span>
      </div>

      <p class="username">@marianvideos</p>
      <p class="bio">Momentos, fotos y contenido especial de Marian 💕</p>

      <div class="actions">
        <a class="action primary" href="https://t.me/marianvideos" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8Z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
          <span>Comprar contenido</span>
        </a>

        <a class="action" href="https://t.me/+63oyr6Flo7Q0OTUx" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="m10 9 5 3-5 3V9Z"></path></svg>
          <span>Ver canal</span>
        </a>

        <a class="action" href="https://t.me/marianvideos" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3 1.5-4A7 7 0 0 1 3 14V9a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v6Z"></path></svg>
          <span>Escribirme</span>
        </a>
      </div>
    </section>

    <div class="tabs">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
        <path d="M3 9h18M3 15h18M9 3v18M15 3v18"></path>
      </svg>
    </div>

    <section class="gallery" id="gallery"></section>
  </main>

  <section class="viewer" id="viewer" aria-hidden="true">
    <button class="viewer-close" id="viewerClose" type="button">×</button>
    <div class="reels" id="reels"></div>
  </section>

  <script>
    const telegramChat = "https://t.me/marianvideos";

    const publications = [
      { type: "image", src: "marian01.jpg", caption: "Un poquito de mí 💕" },
      { type: "image", src: "marian02.jpg", caption: "Tarde deportiva ⚽" },
      { type: "image", src: "marian03.jpg", caption: "¿Jugamos? ✨" },
      { type: "image", src: "marian04.jpg", caption: "Mi lado favorito 🖤" },
      { type: "image", src: "marian05.jpg", caption: "Noche especial ✨" },
      { type: "image", src: "marian06.jpg", caption: "Guardando recuerdos 📸" },
      { type: "image", src: "marian07.jpg", caption: "Un momento de calma 💗" },
      { type: "image", src: "marian08.jpg", caption: "Día de cancha 💕" },
      { type: "image", src: "marian09.jpg", caption: "Sonríe conmigo ✨" }
    ];

    const gallery = document.getElementById("gallery");
    const viewer = document.getElementById("viewer");
    const reels = document.getElementById("reels");
    const viewerClose = document.getElementById("viewerClose");

    function createGallery() {
      gallery.innerHTML = "";

      publications.forEach((publication, index) => {
        const button = document.createElement("button");
        button.className = "post";
        button.type = "button";

        if (publication.type === "video") {
          const video = document.createElement("video");
          video.src = publication.src;
          video.muted = true;
          video.playsInline = true;
          button.appendChild(video);

          const mark = document.createElement("span");
          mark.className = "video-mark";
          mark.textContent = "▶";
          button.appendChild(mark);
        } else {
          const image = document.createElement("img");
          image.src = publication.src;
          image.alt = `Publicación ${index + 1} de Marian`;
          image.loading = "lazy";
          button.appendChild(image);
        }

        button.addEventListener("click", () => openViewer(index));
        gallery.appendChild(button);
      });
    }

    function createReels() {
      reels.innerHTML = "";

      publications.forEach((publication, index) => {
        const reel = document.createElement("article");
        reel.className = "reel";
        reel.dataset.index = index;

        const media = document.createElement(
          publication.type === "video" ? "video" : "img"
        );

        media.src = publication.src;
        media.className = "reel-media";

        if (publication.type === "video") {
          media.controls = true;
          media.loop = true;
          media.playsInline = true;
        }

        reel.appendChild(media);

        const gradient = document.createElement("div");
        gradient.className = "reel-gradient";
        reel.appendChild(gradient);

        const info = document.createElement("div");
        info.className = "reel-info";
        info.innerHTML = `
          <div class="reel-name">
            Marian <span class="mini-verified">✓</span>
          </div>
          <p class="reel-caption">${publication.caption}</p>
        `;
        reel.appendChild(info);

        const actions = document.createElement("div");
        actions.className = "reel-actions";

        const heartButton = document.createElement("button");
        heartButton.className = "round-action";
        heartButton.type = "button";
        heartButton.innerHTML = `
          <svg viewBox="0 0 24 24">
            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 1 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"></path>
          </svg>
        `;
        heartButton.addEventListener("click", () => {
          heartButton.classList.toggle("liked");
        });

        const messageButton = document.createElement("button");
        messageButton.className = "round-action";
        messageButton.type = "button";
        messageButton.innerHTML = `
          <svg viewBox="0 0 24 24">
            <path d="M21 15a4 4 0 0 1-4 4H8l-5 3 1.5-4A7 7 0 0 1 3 14V9a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v6Z"></path>
          </svg>
        `;
        messageButton.addEventListener("click", () => {
          window.open(telegramChat, "_blank");
        });

        actions.appendChild(heartButton);
        actions.appendChild(messageButton);
        reel.appendChild(actions);
        reels.appendChild(reel);
      });
    }

    function openViewer(index) {
      viewer.classList.add("open");
      viewer.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";

      const selectedReel = reels.querySelector(`.reel[data-index="${index}"]`);
      if (selectedReel) {
        selectedReel.scrollIntoView({ block: "start" });
      }
    }

    function closeViewer() {
      viewer.classList.remove("open");
      viewer.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";

      reels.querySelectorAll("video").forEach((video) => video.pause());
    }

    viewerClose.addEventListener("click", closeViewer);

    createGallery();
    createReels();
  </script>
</body>
</html>
