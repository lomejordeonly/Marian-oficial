<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff6f7">
  <title>Marian</title>

  <style>
    :root{
      --rosa:#d98e99;
      --rosa2:#bd7180;
      --texto:#2c2325;
      --suave:#7a6f72;
      --borde:rgba(130,82,92,.16);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#fff9fa;color:var(--texto)}
    a{text-decoration:none;color:inherit}
    button{font:inherit}

    .app{
      width:100%;
      max-width:520px;
      min-height:100vh;
      margin:0 auto;
      background:
        radial-gradient(circle at top left,#ffe5ea 0,transparent 35%),
        radial-gradient(circle at top right,#f9e8df 0,transparent 40%),
        #fffafa;
    }

    .profile{
      padding:24px 16px 18px;
      text-align:center;
      border-bottom:1px solid var(--borde);
      background:rgba(255,255,255,.74);
      backdrop-filter:blur(16px);
    }

    .avatar-wrap{
      position:relative;
      width:116px;
      height:116px;
      margin:0 auto 12px;
      padding:4px;
      border-radius:50%;
      background:linear-gradient(135deg,#c97c88,#f3c8ce,#bd7180);
      box-shadow:0 12px 30px rgba(104,64,73,.14);
    }

    .avatar{
      width:100%;
      height:100%;
      object-fit:cover;
      border-radius:50%;
      border:4px solid #fff;
      display:block;
    }

    .verified{
      position:absolute;
      right:2px;
      bottom:8px;
      width:30px;
      height:30px;
      display:grid;
      place-items:center;
      border-radius:50%;
      border:3px solid #fff;
      color:#fff;
      background:var(--rosa);
      font-weight:800;
    }

    .name-row{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:7px;
    }

    h1{
      margin:0;
      font:500 36px Georgia,"Times New Roman",serif;
    }

    .verified-small{
      width:22px;
      height:22px;
      display:grid;
      place-items:center;
      border-radius:50%;
      color:#fff;
      background:var(--rosa);
      font-size:13px;
      font-weight:900;
    }

    .username{margin:5px 0 8px;color:var(--suave);font-size:15px}
    .bio{margin:0 auto 18px;max-width:340px;line-height:1.45;font-size:15px}

    .actions{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }

    .action{
      min-height:68px;
      padding:9px 5px;
      border:1px solid var(--borde);
      border-radius:17px;
      background:rgba(255,255,255,.92);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:6px;
      font-size:13px;
      font-weight:700;
      box-shadow:0 7px 18px rgba(102,66,73,.08);
    }

    .action.primary{
      color:#fff;
      border-color:transparent;
      background:linear-gradient(135deg,var(--rosa),var(--rosa2));
    }

    .action svg{
      width:23px;
      height:23px;
      fill:none;
      stroke:currentColor;
      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .reels-title{
      padding:14px 16px 10px;
      font-size:15px;
      font-weight:800;
      color:#5d5054;
      background:#fff;
      border-bottom:1px solid var(--borde);
    }

    .reels{
      height:calc(100vh - 305px);
      min-height:520px;
      overflow-y:auto;
      scroll-snap-type:y mandatory;
      background:#050505;
      scrollbar-width:none;
    }

    .reels::-webkit-scrollbar{display:none}

    .reel{
      position:relative;
      height:100%;
      min-height:520px;
      scroll-snap-align:start;
      scroll-snap-stop:always;
      background:#050505;
      overflow:hidden;
    }

    .reel video{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
      background:#050505;
    }

    .shade{
      position:absolute;
      inset:auto 0 0;
      height:42%;
      background:linear-gradient(transparent,rgba(0,0,0,.78));
      pointer-events:none;
    }

    .caption{
      position:absolute;
      left:16px;
      right:84px;
      bottom:24px;
      z-index:2;
      color:#fff;
    }

    .caption-name{
      display:flex;
      align-items:center;
      gap:6px;
      margin-bottom:7px;
      font-weight:800;
      font-size:17px;
    }

    .caption p{
      margin:0;
      line-height:1.38;
      font-size:14px;
      color:rgba(255,255,255,.94);
    }

    .side-actions{
      position:absolute;
      right:14px;
      bottom:22px;
      z-index:3;
      display:flex;
      flex-direction:column;
      gap:16px;
    }

    .circle{
      width:52px;
      height:52px;
      display:grid;
      place-items:center;
      border:0;
      border-radius:50%;
      background:rgba(20,20,20,.48);
      color:#fff;
      backdrop-filter:blur(10px);
      cursor:pointer;
    }

    .circle svg{
      width:29px;
      height:29px;
      fill:none;
      stroke:currentColor;
      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .circle.liked{color:#ff758a}
    .circle.liked svg{fill:currentColor;stroke:currentColor}

    .sound{
      position:absolute;
      right:14px;
      top:14px;
      z-index:3;
      width:42px;
      height:42px;
      display:grid;
      place-items:center;
      border:0;
      border-radius:50%;
      background:rgba(20,20,20,.45);
      color:#fff;
      font-size:18px;
      cursor:pointer;
    }

    @media (min-width:521px){
      body{padding:18px 0}
      .app{border-radius:28px;overflow:hidden;box-shadow:0 0 45px rgba(78,46,53,.11)}
      .reels{height:720px}
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="profile">
      <div class="avatar-wrap">
        <img class="avatar" src="profile.jpg" alt="Foto de Marian">
        <span class="verified">✓</span>
      </div>

      <div class="name-row">
        <h1>Marian</h1>
        <span class="verified-small">✓</span>
      </div>

      <p class="username">@marianvideos</p>
      <p class="bio">Mis momentos, mis reels y un poquito más de mí 💕</p>

      <div class="actions">
        <a class="action primary" href="tg://resolve?domain=marianvideos">
          <svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8Z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
          <span>Comprar contenido</span>
        </a>

        <a class="action" href="https://t.me/+63oyr6Flo7Q0OTUx">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="m10 9 5 3-5 3V9Z"></path></svg>
          <span>Ver canal</span>
        </a>

        <a class="action" href="tg://resolve?domain=marianvideos">
          <svg viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3 1.5-4A7 7 0 0 1 3 14V9a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v6Z"></path></svg>
          <span>Escribirme</span>
        </a>
      </div>
    </section>

    <div class="reels-title">Reels de Marian</div>
    <section class="reels" id="reels"></section>
  </main>

  <script>
    const chatDirecto = "tg://resolve?domain=marianvideos";

    const videos = [
      { src: "reel00001.mp4", caption: "Hoy vine a dejarte pensando en mí 💕" },
      { src: "reel00002.mp4", caption: "Un momento que quería compartir contigo ✨" },
      { src: "reel00003.mp4", caption: "Desliza, pero no te vayas tan rápido 😘" },
      { src: "reel00004.mp4", caption: "Mi energía favorita siempre aparece aquí 💗" },
      { src: "reel00005.mp4", caption: "Solo un poquito de mi día para ti ✨" },
      { src: "reel00006.mp4", caption: "¿Cuál ha sido tu reel favorito hasta ahora? 👀" },
      { src: "reel00007.mp4", caption: "Me encanta cuando te quedas a mirar 💕" },
      { src: "reel00008.mp4", caption: "Hoy estoy de buen humor y se nota 😘" },
      { src: "reel00009.mp4", caption: "Otro momento mío que no quería guardar sola ✨" },
      { src: "reel00010.mp4", caption: "Sigue deslizando, todavía falta lo mejor 💗" },
      { src: "reel00011.mp4", caption: "Aquí siempre encontrarás algo nuevo de mí 👀" },
      { src: "reel00012.mp4", caption: "Llegaste al último… ¿me escribes? 💕" }
    ];

    const reels = document.getElementById("reels");

    videos.forEach((item, index) => {
      const reel = document.createElement("article");
      reel.className = "reel";

      const video = document.createElement("video");
      video.src = item.src;
      video.muted = true;
      video.loop = true;
      video.playsInline = true;
      video.preload = "metadata";
      video.setAttribute("webkit-playsinline", "");
      reel.appendChild(video);

      const sound = document.createElement("button");
      sound.className = "sound";
      sound.type = "button";
      sound.textContent = "🔇";
      sound.addEventListener("click", () => {
        video.muted = !video.muted;
        sound.textContent = video.muted ? "🔇" : "🔊";
        video.play().catch(() => {});
      });
      reel.appendChild(sound);

      const shade = document.createElement("div");
      shade.className = "shade";
      reel.appendChild(shade);

      const caption = document.createElement("div");
      caption.className = "caption";
      caption.innerHTML = `
        <div class="caption-name">
          Marian <span class="verified-small">✓</span>
        </div>
        <p>${item.caption}</p>
      `;
      reel.appendChild(caption);

      const side = document.createElement("div");
      side.className = "side-actions";

      const heart = document.createElement("button");
      heart.className = "circle";
      heart.type = "button";
      heart.setAttribute("aria-label", "Me gusta");
      heart.innerHTML = `
        <svg viewBox="0 0 24 24">
          <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 1 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"></path>
        </svg>
      `;
      heart.addEventListener("click", () => heart.classList.toggle("liked"));

      const message = document.createElement("button");
      message.className = "circle";
      message.type = "button";
      message.setAttribute("aria-label", "Escribirle a Marian");
      message.innerHTML = `
        <svg viewBox="0 0 24 24">
          <path d="M21 15a4 4 0 0 1-4 4H8l-5 3 1.5-4A7 7 0 0 1 3 14V9a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v6Z"></path>
        </svg>
      `;
      message.addEventListener("click", () => {
        window.location.href = chatDirecto;
      });

      side.appendChild(heart);
      side.appendChild(message);
      reel.appendChild(side);

      reels.appendChild(reel);
    });

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        const video = entry.target.querySelector("video");
        if (!video) return;

        if (entry.isIntersecting && entry.intersectionRatio >= 0.65) {
          document.querySelectorAll(".reel video").forEach((other) => {
            if (other !== video) other.pause();
          });
          video.play().catch(() => {});
        } else {
          video.pause();
        }
      });
    }, { threshold: [0.65] });

    document.querySelectorAll(".reel").forEach((reel) => observer.observe(reel));
  </script>
</body>
</html>
