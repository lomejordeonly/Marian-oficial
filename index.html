<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff9fb" />
  <title>Marian</title>
  <style>
    :root {
      --bg: #fff9fb;
      --card: #ffffff;
      --text: #241b1f;
      --muted: #8b7c82;
      --line: #eee3e7;
      --pink: #dd788f;
      --pink-dark: #c75f79;
      --pink-soft: #f7dfe6;
      --blue: #3897f0;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    button { font: inherit; }

    .page { width: 100%; max-width: 680px; margin: 0 auto; background: var(--card); min-height: 100vh; }

    .profile {
      padding: 22px 18px 20px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fff7fa 0%, #ffffff 100%);
    }

    .instagram-top {
      display: grid;
      grid-template-columns: 104px 1fr;
      gap: 18px;
      align-items: center;
    }

    .avatar-ring {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, #f7b2c3, #ca7188, #f3d2dc);
      box-shadow: 0 8px 25px rgba(197, 95, 121, .16);
    }
    .avatar-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 4px solid #fff;
    }

    .identity { min-width: 0; }
    .name-row { display: flex; align-items: center; gap: 7px; }
    .name {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(35px, 8vw, 48px);
      line-height: 1;
      font-weight: 500;
      letter-spacing: -1px;
    }
    .verified {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      background: var(--blue);
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      box-shadow: 0 2px 8px rgba(56,151,240,.25);
    }
    .username { margin-top: 8px; color: var(--muted); font-size: 17px; }

    .bio {
      margin: 18px 0 0;
      font-size: 17px;
      line-height: 1.45;
      text-align: left;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
      margin-top: 18px;
    }
    .action {
      min-height: 76px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      padding: 10px 6px;
      cursor: pointer;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 7px;
      box-shadow: 0 5px 16px rgba(38, 21, 28, .04);
      -webkit-tap-highlight-color: transparent;
    }
    .action.primary { background: var(--pink); color: white; border-color: var(--pink); }
    .action-icon { font-size: 23px; line-height: 1; }
    .action-label { font-size: 14px; line-height: 1.15; text-align: center; }

    .tabs {
      height: 52px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 1px solid var(--line);
      color: var(--pink-dark);
      font-size: 26px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      background: #fff;
    }
    .tile {
      position: relative;
      aspect-ratio: 9 / 13;
      overflow: hidden;
      background: #111;
      cursor: pointer;
      border: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .tile video,
    .tile canvas,
    .tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .tile video { opacity: 0; position: absolute; inset: 0; }
    .tile canvas { position: absolute; inset: 0; }
    .tile::after {
      content: "▶";
      position: absolute;
      right: 8px;
      top: 8px;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      padding-left: 2px;
      background: rgba(0,0,0,.55);
      color: #fff;
      font-size: 11px;
      z-index: 3;
    }
    .tile.loading::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, #171717 25%, #252525 40%, #171717 55%);
      background-size: 200% 100%;
      animation: shine 1.1s linear infinite;
      z-index: 1;
    }
    @keyframes shine { to { background-position-x: -200%; } }

    .viewer {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 1000;
      display: none;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      overscroll-behavior: contain;
      scrollbar-width: none;
    }
    .viewer::-webkit-scrollbar { display: none; }
    .viewer.open { display: block; }

    .viewer-close {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: 14px;
      z-index: 1100;
      border: 0;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(0,0,0,.48);
      color: #fff;
      font-size: 29px;
      line-height: 1;
      cursor: pointer;
    }

    .reel {
      height: 100svh;
      min-height: 100vh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      display: grid;
      place-items: center;
      background: #000;
    }
    .reel video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .reel-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to bottom, transparent 58%, rgba(0,0,0,.68) 100%);
    }
    .reel-info {
      position: absolute;
      left: 16px;
      right: 88px;
      bottom: max(22px, env(safe-area-inset-bottom));
      color: #fff;
      z-index: 2;
    }
    .reel-user { font-weight: 800; font-size: 16px; margin-bottom: 7px; }
    .reel-caption { font-size: 14px; line-height: 1.35; }

    .reel-actions {
      position: absolute;
      right: 14px;
      bottom: calc(max(22px, env(safe-area-inset-bottom)) + 8px);
      z-index: 4;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .circle-action {
      width: 52px;
      min-height: 52px;
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,.38);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 25px;
      cursor: pointer;
      pointer-events: auto;
      backdrop-filter: blur(4px);
    }
    .circle-action.liked { color: #ff416c; background: rgba(255,255,255,.92); }
    .sound-hint {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      right: 14px;
      z-index: 3;
      color: #fff;
      background: rgba(0,0,0,.42);
      border-radius: 999px;
      padding: 8px 11px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s;
    }
    .sound-hint.show { opacity: 1; }

    @media (max-width: 430px) {
      .profile { padding: 19px 14px 17px; }
      .instagram-top { grid-template-columns: 92px 1fr; gap: 14px; }
      .avatar-ring { width: 92px; height: 92px; }
      .name { font-size: 39px; }
      .bio { font-size: 15px; }
      .actions { gap: 7px; }
      .action { min-height: 73px; border-radius: 14px; }
      .action-label { font-size: 13px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="profile">
      <div class="instagram-top">
        <div class="avatar-ring">
          <img src="profile.jpg" alt="Foto de perfil de Marian" />
        </div>

        <div class="identity">
          <div class="name-row">
            <h1 class="name">Marian</h1>
            <span class="verified" aria-label="Cuenta verificada">✓</span>
          </div>
          <div class="username">@marianvideos</div>
        </div>
      </div>

      <p class="bio">Mis momentos, mis reels y un poquito más de mí 💕</p>

      <div class="actions">
        <button class="action primary" type="button" onclick="openChat()">
          <span class="action-icon">♧</span>
          <span class="action-label">Comprar<br />contenido</span>
        </button>
        <button class="action" type="button" onclick="openChannel()">
          <span class="action-icon">▣</span>
          <span class="action-label">Ver canal</span>
        </button>
        <button class="action" type="button" onclick="openChat()">
          <span class="action-icon">▢</span>
          <span class="action-label">Escribirme</span>
        </button>
      </div>
    </section>

    <div class="tabs" aria-label="Reels">▦</div>
    <section id="grid" class="grid" aria-label="Galería de reels"></section>
  </main>

  <section id="viewer" class="viewer" aria-hidden="true">
    <button class="viewer-close" type="button" aria-label="Cerrar" onclick="closeViewer()">×</button>
  </section>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const TELEGRAM_USER = "marianvideos";
    const TELEGRAM_CHANNEL = "https://t.me/+63oyr6Flo7Q0OTUx";

    const reels = Array.from({ length: 12 }, (_, index) => ({
      src: `reel${String(index + 1).padStart(5, "0")}.mp4`,
      caption: "Mis momentos y un poquito más de mí 💕"
    }));

    const grid = document.getElementById("grid");
    const viewer = document.getElementById("viewer");
    let activeIndex = 0;

    function openTelegramLink(url) {
      if (window.Telegram?.WebApp?.openTelegramLink) {
        window.Telegram.WebApp.openTelegramLink(url);
      } else {
        window.location.href = url;
      }
    }

    function openChat() {
      const tgUrl = `tg://resolve?domain=${TELEGRAM_USER}`;
      if (window.Telegram?.WebApp?.openTelegramLink) {
        window.Telegram.WebApp.openTelegramLink(`https://t.me/${TELEGRAM_USER}`);
      } else {
        window.location.href = tgUrl;
      }
    }

    function openChannel() {
      openTelegramLink(TELEGRAM_CHANNEL);
    }

    function makeThumbnail(reel, index) {
      const tile = document.createElement("button");
      tile.type = "button";
      tile.className = "tile loading";
      tile.setAttribute("aria-label", `Abrir reel ${index + 1}`);

      const video = document.createElement("video");
      video.src = reel.src;
      video.muted = true;
      video.playsInline = true;
      video.preload = "metadata";

      const canvas = document.createElement("canvas");
      canvas.width = 360;
      canvas.height = 520;

      tile.append(video, canvas);
      tile.addEventListener("click", () => openViewer(index));
      grid.appendChild(tile);

      const drawFrame = () => {
        try {
          const ctx = canvas.getContext("2d");
          const vw = video.videoWidth || 360;
          const vh = video.videoHeight || 520;
          const scale = Math.max(canvas.width / vw, canvas.height / vh);
          const dw = vw * scale;
          const dh = vh * scale;
          const dx = (canvas.width - dw) / 2;
          const dy = (canvas.height - dh) / 2;
          ctx.drawImage(video, dx, dy, dw, dh);
          tile.classList.remove("loading");
          video.remove();
        } catch (error) {
          tile.classList.remove("loading");
        }
      };

      video.addEventListener("loadedmetadata", () => {
        const target = Math.min(0.35, Math.max(0.05, (video.duration || 1) / 10));
        try { video.currentTime = target; } catch (_) { drawFrame(); }
      }, { once: true });

      video.addEventListener("seeked", drawFrame, { once: true });
      video.addEventListener("loadeddata", () => {
        if (!video.seeking) drawFrame();
      }, { once: true });
      video.addEventListener("error", () => tile.classList.remove("loading"), { once: true });
    }

    function buildViewer() {
      reels.forEach((reel, index) => {
        const item = document.createElement("article");
        item.className = "reel";
        item.dataset.index = index;

        const video = document.createElement("video");
        video.src = reel.src;
        video.playsInline = true;
        video.loop = true;
        video.preload = "metadata";
        video.setAttribute("webkit-playsinline", "true");

        const overlay = document.createElement("div");
        overlay.className = "reel-overlay";

        const info = document.createElement("div");
        info.className = "reel-info";
        info.innerHTML = `<div class="reel-user">@${TELEGRAM_USER} ✓</div><div class="reel-caption">${reel.caption}</div>`;

        const actions = document.createElement("div");
        actions.className = "reel-actions";

        const heart = document.createElement("button");
        heart.type = "button";
        heart.className = "circle-action";
        heart.setAttribute("aria-label", "Me gusta");
        heart.textContent = "♡";
        heart.addEventListener("click", (event) => {
          event.stopPropagation();
          heart.classList.toggle("liked");
          heart.textContent = heart.classList.contains("liked") ? "♥" : "♡";
        });

        const comment = document.createElement("button");
        comment.type = "button";
        comment.className = "circle-action";
        comment.setAttribute("aria-label", "Escribir por Telegram");
        comment.textContent = "◯";
        comment.addEventListener("click", (event) => {
          event.stopPropagation();
          openChat();
        });

        const sound = document.createElement("button");
        sound.type = "button";
        sound.className = "circle-action";
        sound.setAttribute("aria-label", "Activar o quitar sonido");
        sound.textContent = "🔊";
        sound.addEventListener("click", (event) => {
          event.stopPropagation();
          video.muted = !video.muted;
          sound.textContent = video.muted ? "🔇" : "🔊";
          video.play().catch(() => {});
        });

        actions.append(heart, comment, sound);
        item.append(video, overlay, info, actions);

        item.addEventListener("click", (event) => {
          if (event.target.closest("button")) return;
          if (video.paused) video.play().catch(() => {});
          else video.pause();
        });

        viewer.appendChild(item);
      });
    }

    function stopAllExcept(index) {
      viewer.querySelectorAll(".reel video").forEach((video, i) => {
        if (i === index) {
          video.muted = false;
          video.play().catch(() => {
            video.muted = true;
            video.play().catch(() => {});
          });
        } else {
          video.pause();
          video.currentTime = 0;
        }
      });
    }

    function openViewer(index) {
      activeIndex = index;
      viewer.classList.add("open");
      viewer.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      const reelElement = viewer.querySelector(`.reel[data-index="${index}"]`);
      reelElement?.scrollIntoView({ block: "start" });
      setTimeout(() => stopAllExcept(index), 120);
    }

    function closeViewer() {
      viewer.classList.remove("open");
      viewer.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      viewer.querySelectorAll("video").forEach(video => video.pause());
    }

    const observer = new IntersectionObserver((entries) => {
      if (!viewer.classList.contains("open")) return;
      entries.forEach(entry => {
        if (entry.isIntersecting && entry.intersectionRatio > 0.65) {
          const index = Number(entry.target.dataset.index);
          activeIndex = index;
          stopAllExcept(index);
        }
      });
    }, { root: viewer, threshold: [0.65] });

    reels.forEach(makeThumbnail);
    buildViewer();
    viewer.querySelectorAll(".reel").forEach(reel => observer.observe(reel));

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && viewer.classList.contains("open")) closeViewer();
    });
  </script>
</body>
</html>
